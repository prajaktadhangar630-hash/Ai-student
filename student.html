<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Profile</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="navbar">

        <div class="logo">
            🌱 AI Learning Support
        </div>

        <div class="step-text">
            Step 1 of 3
        </div>

    </header>


    <!-- Student Form -->
    <main class="student-page">

        <div class="student-card">

            <span class="badge">
                STUDENT PROFILE
            </span>

            <h1>
                Tell Us About Yourself
            </h1>

            <p>
                Enter your basic details to begin the learning screening.
            </p>


            <form id="studentForm" onsubmit="saveStudent(event)">

                <!-- Student Name -->
                <label for="studentName">
                    Student Name
                </label>

                <input
                    type="text"
                    id="studentName"
                    placeholder="Enter your name"
                    required
                >


                <!-- Age -->
                <label for="studentAge">
                    Age
                </label>

                <input
                    type="number"
                    id="studentAge"
                    placeholder="Enter your age"
                    min="5"
                    max="20"
                    required
                >


                <!-- Standard -->
                <label for="studentClass">
                    Standard
                </label>

                <select id="studentClass" required>

                    <option value="">
                        Select Standard
                    </option>

                    <option value="3">
                        3rd Standard
                    </option>

                    <option value="4">
                        4th Standard
                    </option>

                    <option value="5">
                        5th Standard
                    </option>

                    <option value="6">
                        6th Standard
                    </option>

                    <option value="7">
                        7th Standard
                    </option>

                    <option value="8">
                        8th Standard
                    </option>

                    <option value="9">
                        9th Standard
                    </option>

                    <option value="10">
                        10th Standard
                    </option>

                </select>


                <!-- Button -->
                <button
                    type="submit"
                    class="main-btn"
                >
                    Continue →
                </button>

            </form>

        </div>

    </main>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
